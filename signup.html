<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <form id="signupForm" class="space-y-4 p-6 bg-white rounded shadow max-w-md w-full">
        <h2 class="text-2xl font-bold mb-4 text-center">Create Account</h2>
        <div>
            <label class="block text-gray-600 text-sm mb-1">Full Name</label>
            <input type="text" id="name" placeholder="Full Name" class="w-full border p-2 rounded" required>
        </div>
        <div>
            <label class="block text-gray-600 text-sm mb-1">Email Address</label>
            <input type="email" id="email" placeholder="Email Address" class="w-full border p-2 rounded" required>
        </div>
        <div>
            <label class="block text-gray-600 text-sm mb-1">Password</label>
            <input type="password" id="password" placeholder="Password" class="w-full border p-2 rounded" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700">Sign Up</button>
        <p class="text-center text-sm text-gray-600 mt-2">
            Already have an account? <a href="login.html" class="text-blue-600 underline">Login</a>
        </p>
    </form>

    <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        localStorage.setItem('registeredUser', JSON.stringify(user));
        alert('Signup Successful! Please Login.');
        window.location.href = 'login.html';
    });
    </script>

</body>
</html>
