<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
   
    <!-- Login Form -->
    <div class="bg-white p-8 sm:p-10 rounded-xl shadow-md border border-gray-100">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Login</h2>
     
      <form class="space-y-4" id="loginForm">
        <div>
          <label for="loginEmail" class="block text-sm text-gray-700 mb-1">Email</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            required
            class="w-full px-4 py-2.5 border border-gray-900 rounded-full focus:outline-none focus:ring-2 focus:ring-[#ff0055] text-sm"
          >
        </div>
 
        <div>
          <label for="loginPassword" class="block text-sm text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="password"
            required
            class="w-full px-4 py-2.5 border border-gray-900 rounded-full focus:outline-none focus:ring-2 focus:ring-[#ff0055] text-sm"
          >
        </div>
 
        <div class="flex items-center pt-1">
          <input
            type="checkbox"
            id="remember-me"
            name="remember-me"
            class="h-4 w-4 rounded border-gray-300 text-[#ff0055] focus:ring-[#ff0055]"
          >
          <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember Me</label>
        </div>
 
        <div class="pt-1">
          <a href="#" class="text-sm font-normal text-[#ff0055] hover:underline">Forgot Password?</a>
        </div>
 
        <div class="pt-3">
          <button
            type="submit"
            class="w-full bg-[#ff0055] hover:bg-[#d90048] active:scale-95 text-white font-medium py-3 rounded-full transition-all duration-200 cursor-pointer shadow-sm text-sm"
          >
            Login
          </button>
        </div>
      </form>
    </div>
 
    <!-- Register Form -->
    <div class="bg-white p-8 sm:p-10 rounded-xl shadow-md border border-gray-100">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Register</h2>
 
      <form id="registerForm" class="space-y-4">
        <input type="email" id="regEmail" placeholder="Email" required class="w-full border p-2 rounded" />
        <input type="password" id="regPassword" placeholder="Password (at least 8 characters)" minlength="8" required class="w-full border p-2 rounded" />
        <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required class="w-full border p-2 rounded" />
       
        <button type="submit" class="w-full bg-pink-600 text-white py-2 rounded">Register</button>
      </form>
    </div>
 
  </div>
</div>

     document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault(); 

      // Inputs target karein
      const emailInput = document.getElementById('regEmail');
      const passwordInput = document.getElementById('regPassword');
      const confirmPasswordInput = document.getElementById('regConfirmPassword');

      const email = emailInput.value;
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        alert('Password aur Confirm Password match nahi ho rahe hain!');
        return;
      }

      try {
        const response = await fetch(`http://${window.location.hostname}:5501/api/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Registration Successful!');
          this.reset(); 
        } else {
          alert(data.message || 'Registration failed!');
        }
      } catch (error) {
        console.error('Registration request failed:', error);
        alert('Server se connection fail ho gaya. Backend server check karke dobara try karein.');
      }
    });
