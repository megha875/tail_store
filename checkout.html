<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Polaroid Banner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    .font-serif-custom {
      font-family: 'Playfair Display', serif;
    }
   
  </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8 flex justify-center items-center min-h-screen">


  <script>
    function swapPolaroids(containerId, clickedCard) {
      const stack = document.getElementById(containerId);
      const cards = stack.querySelectorAll('.polaroid-card');

      cards.forEach(card => {
        if (card === clickedCard) {
          card.classList.remove('z-10', 'shadow-md');
          card.classList.add('z-20', 'shadow-2xl');
        } else {
          card.classList.remove('z-20', 'shadow-2xl', 'shadow-xl');
          card.classList.add('z-10', 'shadow-md');
        }
      });
    }
  </script>

</body>
</html>
