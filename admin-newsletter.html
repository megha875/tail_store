<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Homepage Newsletter</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-['Manrope']">
    <header class="bg-[#050B14] px-6 py-5 text-white">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3">
            <h1 class="text-xl font-bold md:text-2xl">Newsletter Admin</h1>
            <nav class="flex flex-wrap items-center gap-2">
                <a href="admin.html" class="rounded-lg px-4 py-2 text-sm font-semibold hover:bg-white/10">Add Product</a>
                <a href="admin-banner.html" class="rounded-lg px-4 py-2 text-sm font-semibold hover:bg-white/10">Add Banner</a>
                <a href="admin-newsletter.html" aria-current="page" class="rounded-lg bg-white/10 px-4 py-2 text-sm font-semibold">Newsletter</a>
                <a href="admin-homepage.html" class="rounded-lg px-4 py-2 text-sm font-semibold hover:bg-white/10">Homepage Heading</a>
                <a href="index.html" class="rounded-lg bg-[#FF0043] px-5 py-2 text-sm font-semibold hover:bg-[#d90039]">View Store</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-4xl px-4 py-10">
        <section class="rounded-2xl border bg-white p-6 shadow-sm md:p-8">
            <h2 class="text-2xl font-bold text-gray-900">Homepage Newsletter</h2>
            <p class="mb-8 mt-1 text-gray-500">Newsletter ke text ko MongoDB mein save karein.</p>
            <form id="newsletterSettingsForm" class="space-y-5">
                <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                    <label class="block"><span class="mb-2 block text-sm font-semibold text-gray-700">Heading</span><input name="heading" maxlength="120" required class="w-full rounded-lg border border-gray-300 px-4 py-3"></label>
                    <label class="block"><span class="mb-2 block text-sm font-semibold text-gray-700">Highlighted offer</span><input name="offer" maxlength="120" required class="w-full rounded-lg border border-gray-300 px-4 py-3"></label>
                    <label class="block"><span class="mb-2 block text-sm font-semibold text-gray-700">Ending text</span><input name="ending" maxlength="120" required class="w-full rounded-lg border border-gray-300 px-4 py-3"></label>
                    <label class="block"><span class="mb-2 block text-sm font-semibold text-gray-700">Email placeholder</span><input name="placeholder" maxlength="100" required class="w-full rounded-lg border border-gray-300 px-4 py-3"></label>
                    <label class="block"><span class="mb-2 block text-sm font-semibold text-gray-700">Button text</span><input name="buttonText" maxlength="40" required class="w-full rounded-lg border border-gray-300 px-4 py-3"></label>
                </div>
                <div id="newsletterSettingsMessage" class="hidden rounded-lg px-4 py-3 text-sm font-semibold" role="status" aria-live="polite"></div>
                <button id="newsletterSettingsSubmit" type="submit" class="w-full rounded-lg bg-[#FF0043] py-3.5 font-bold text-white transition hover:bg-[#d90039]">Save Newsletter</button>
            </form>
        </section>
    </main>
    <script>
        (() => {
            const form = document.getElementById('newsletterSettingsForm');
            const message = document.getElementById('newsletterSettingsMessage');
            const submitButton = document.getElementById('newsletterSettingsSubmit');
            const apiHost = window.location.hostname || '127.0.0.1';
            const apiBaseUrl = ['localhost', '127.0.0.1'].includes(apiHost) || window.location.protocol === 'file:'
                ? `http://${apiHost}:5000`
                : window.location.origin;

            function showMessage(text, isError = false) {
                message.className = `rounded-lg px-4 py-3 text-sm font-semibold ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
                message.textContent = text;
                message.classList.remove('hidden');
            }

            async function loadSettings() {
                try {
                    const response = await fetch(`${apiBaseUrl}/api/newsletter/settings`);
                    const settings = await response.json();
                    if (!response.ok) throw new Error(settings.message || `Settings load failed (HTTP ${response.status}).`);
                    for (const field of ['heading', 'offer', 'ending', 'placeholder', 'buttonText']) {
                        form.elements[field].value = settings[field] || '';
                    }
                } catch (error) {
                    console.error('Newsletter settings load failed:', error);
                    showMessage(error.message || 'Newsletter settings could not be loaded.', true);
                }
            }

            form.addEventListener('submit', async event => {
                event.preventDefault();
                submitButton.disabled = true;
                try {
                    const response = await fetch(`${apiBaseUrl}/api/newsletter/settings`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message || `Settings save failed (HTTP ${response.status}).`);
                    showMessage(result.message || 'Newsletter content saved to MongoDB.');
                } catch (error) {
                    console.error('Newsletter settings save failed:', error);
                    showMessage(error.message || 'Newsletter content could not be saved.', true);
                } finally {
                    submitButton.disabled = false;
                }
            });

            loadSettings();
        })();
    </script>
</body>
</html>
