<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Edit Product</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 font-['Manrope']">

    <header class="bg-[#050B14] text-white px-6 py-5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl md:text-2xl font-bold">Product Admin</h1>
            <nav class="flex flex-wrap items-center gap-2">
                <a href="admin.html" class="px-4 py-2 rounded-lg text-sm font-semibold hover:bg-white/10">Add Product</a>
                <a href="index.html" class="bg-[#FF0043] px-5 py-2 rounded-lg text-sm font-semibold hover:bg-[#d90039]">View Store</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div class="bg-white rounded-2xl shadow-sm border p-6 md:p-8">

            <h2 class="text-2xl font-bold text-gray-900">Edit Product</h2>
            <p class="text-gray-500 mt-1 mb-8">
                Yahan jo bhi badlav karoge wo save karte hi MongoDB mein update ho jayega.
            </p>

            <form id="editForm" class="space-y-6">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Edit karne ke liye Product chuniye</label>
                    <select id="productSelect"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043] bg-white">
                        <option value="">Products load ho rahe hain...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
                    <input type="text" id="productName" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Price</label>
                        <input type="number" id="productPrice" min="0" required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Stock</label>
                        <input type="number" id="productStock" min="0" step="1" required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                        <select id="productCategory" required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043] bg-white">
                            <option value="men">Men</option>
                            <option value="women">Women</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Image URL (Main Thumbnail)</label>
                    <input type="url" id="productImage" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Gallery Image URLs (Comma Separated)</label>
                    <textarea id="galleryImages" rows="3"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Color-wise Product Images (one per line)</label>
                    <textarea id="colorImagesInput" rows="4"
                        placeholder="Red=https://example.com/red-shirt.jpg&#10;Blue=https://example.com/blue-shirt.jpg"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]"></textarea>
                    <p class="text-xs text-gray-500 mt-1">Color name aur image URL ko = se separate karein.</p>
                </div>

                <div class="rounded-xl border border-gray-300 p-5 space-y-6">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <p class="text-sm font-semibold text-gray-800">Available Colors</p>
                            <span id="colorsSummary" class="text-xs text-gray-400"></span>
                        </div>
                        <div id="colorPicker"></div>
                        <input type="hidden" id="productColors">
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <p class="text-sm font-semibold text-gray-800">Sizes</p>
                            <span id="sizesSummary" class="text-xs text-gray-400"></span>
                        </div>
                        <div id="sizePicker"></div>
                        <input type="hidden" id="productSizes">
                    </div>
                </div>

                <fieldset class="rounded-lg border border-gray-300 px-4 py-3">
                    <legend class="px-1 text-sm font-semibold text-gray-700">Show product in</legend>
                    <div class="flex flex-wrap gap-6">
                        <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                            <input id="addToLatest" type="checkbox" class="h-4 w-4 accent-[#FF0043]"> Latest Products
                        </label>
                        <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                            <input id="addToPopular" type="checkbox" class="h-4 w-4 accent-[#FF0043]"> Popular Products
                        </label>
                        <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                            <input id="addToSale" type="checkbox" class="h-4 w-4 accent-[#FF0043]"> Sale page
                        </label>
                    </div>
                </fieldset>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                    <textarea id="productDescription" rows="5"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF0043]"></textarea>
                </div>

                <div id="imagePreviewBox" class="hidden">
                    <p class="text-sm font-semibold text-gray-700 mb-2">Image Preview</p>
                    <img id="imagePreview" src="" alt="Product Preview" class="w-40 h-40 object-cover rounded-xl border">
                </div>

                <div id="formMessage" class="hidden rounded-lg px-4 py-3 text-sm font-semibold"></div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-[#FF0043] hover:bg-[#d90039] text-white font-bold py-3.5 rounded-lg transition">
                        Update Product
                    </button>
                    <a href="index.html"
                        class="sm:w-40 text-center border border-gray-300 text-gray-700 font-semibold py-3.5 rounded-lg hover:bg-gray-50 transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script src="./assets/js/admin-edit.js"></script>
    <script>
        // ---- Reusable Color swatch / Size chip picker (design jaisa) ----
        const COLOR_PRESETS = ['Black', 'White', 'Red', 'Blue', 'Green', 'Yellow', 'Pink', 'Grey', 'Navy', 'Beige', 'Brown', 'Orange', 'Purple', 'Maroon'];
        const SIZE_PRESETS = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];

        function createOptionPicker({ mount, kind, presets, hidden, summary }) {
            const isColor = kind === 'color';
            let selected = [];
            let adding = false;
            const validColor = (v) => window.CSS && CSS.supports('color', v);

            function sync() {
                if (hidden) hidden.value = selected.join(', ');
                if (summary) summary.textContent = selected.length ? selected.length + ' selected: ' + selected.join(', ') : 'Kuch select nahi kiya';
            }

            function toggle(value) {
                selected = selected.includes(value) ? selected.filter(v => v !== value) : [...selected, value];
                render();
            }

            function addCustom(raw) {
                const value = String(raw || '').trim();
                if (!value) return;
                if (!selected.includes(value)) selected = [...selected, value];
                adding = false;
                render();
            }

            function render() {
                const all = [...new Set([...presets, ...selected])];
                mount.innerHTML = '';
                const row = document.createElement('div');
                row.className = 'flex flex-wrap items-center gap-3';

                all.forEach((value) => {
                    const on = selected.includes(value);
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.title = value;
                    btn.setAttribute('aria-pressed', String(on));
                    if (isColor && validColor(value)) {
                        btn.setAttribute('aria-label', value);
                        btn.className = 'w-9 h-9 rounded-lg border border-gray-300 transition ' +
                            (on ? 'ring-2 ring-offset-2 ring-[#FF0043]' : 'opacity-70 hover:opacity-100');
                        btn.style.background = value;
                    } else {
                        btn.className = 'min-w-[2.5rem] h-9 px-3 rounded-lg border text-xs font-semibold transition ' +
                            (on ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-300 hover:border-gray-500');
                        btn.textContent = value;
                    }
                    btn.addEventListener('click', () => toggle(value));
                    row.appendChild(btn);
                });

                if (!adding) {
                    const addBtn = document.createElement('button');
                    addBtn.type = 'button';
                    addBtn.className = 'h-9 px-3 rounded-lg border border-dashed border-gray-400 text-xs font-semibold text-gray-600 hover:border-[#FF0043] hover:text-[#FF0043]';
                    addBtn.textContent = '+ Add';
                    addBtn.addEventListener('click', () => { adding = true; render(); });
                    row.appendChild(addBtn);
                }
                mount.appendChild(row);

                if (adding) {
                    const form = document.createElement('div');
                    form.className = 'mt-3 flex flex-wrap items-center gap-2';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = isColor ? 'Color name ya #hex (jaise Mustard / #FFC107)' : 'Size (jaise 32, 34, Free Size)';
                    input.className = 'flex-1 min-w-[200px] border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#FF0043]';
                    form.appendChild(input);
                    if (isColor) {
                        const picker = document.createElement('input');
                        picker.type = 'color';
                        picker.value = '#ffc107';
                        picker.className = 'w-10 h-10 rounded cursor-pointer border border-gray-300 p-0.5 bg-white';
                        picker.title = 'Color picker se chuniye';
                        picker.addEventListener('input', () => { input.value = picker.value.toUpperCase(); });
                        form.appendChild(picker);
                    }
                    const ok = document.createElement('button');
                    ok.type = 'button';
                    ok.className = 'px-4 py-2 rounded-lg bg-[#FF0043] text-white text-sm font-semibold hover:bg-[#d90039]';
                    ok.textContent = 'Add';
                    ok.addEventListener('click', () => addCustom(input.value));
                    const cancel = document.createElement('button');
                    cancel.type = 'button';
                    cancel.className = 'px-3 py-2 rounded-lg border border-gray-300 text-sm text-gray-600';
                    cancel.textContent = 'Cancel';
                    cancel.addEventListener('click', () => { adding = false; render(); });
                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addCustom(input.value); } });
                    form.append(ok, cancel);
                    mount.appendChild(form);
                    input.focus();
                }
                sync();
            }

            render();
            return {
                get: () => [...selected],
                set: (list) => { selected = Array.isArray(list) ? list.filter(Boolean) : []; adding = false; render(); }
            };
        }
    </script>
    <script>
        // Edit page kholne wala admin hai -> store par Edit buttons dikhane ke liye admin mode ON
        window.TailStoreAdmin && window.TailStoreAdmin.setAdmin(true);

        const editForm = document.getElementById('editForm');
        const formMessage = document.getElementById('formMessage');
        const submitBtn = document.getElementById('submitBtn');
        const productImage = document.getElementById('productImage');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewBox = document.getElementById('imagePreviewBox');

        const colorPicker = createOptionPicker({ mount: document.getElementById('colorPicker'), kind: 'color', presets: COLOR_PRESETS, hidden: document.getElementById('productColors'), summary: document.getElementById('colorsSummary') });
        const sizePicker = createOptionPicker({ mount: document.getElementById('sizePicker'), kind: 'size', presets: SIZE_PRESETS, hidden: document.getElementById('productSizes'), summary: document.getElementById('sizesSummary') });

        const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const apiHost = window.location.hostname || '127.0.0.1';
        const apiBaseUrl = isLocalHost || window.location.protocol === 'file:'
            ? `http://${apiHost}:5000`
            : window.location.origin;

        function showMessage(text, ok) {
            formMessage.className = 'rounded-lg px-4 py-3 text-sm font-semibold ' +
                (ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700');
            formMessage.innerText = text;
            formMessage.classList.remove('hidden');
        }

        function updatePreview() {
            const url = productImage.value.trim();
            if (url) { imagePreview.src = url; imagePreviewBox.classList.remove('hidden'); }
            else { imagePreviewBox.classList.add('hidden'); }
        }
        productImage.addEventListener('input', updatePreview);

        const productSelect = document.getElementById('productSelect');
        let currentId = new URLSearchParams(window.location.search).get('id') || '';

        function productApiUrl(id) {
            return `${apiBaseUrl}/api/products/${encodeURIComponent(id)}`;
        }

        function clearForm() {
            editForm.reset();
            colorPicker.set([]);
            sizePicker.set([]);
            updatePreview();
            submitBtn.disabled = true;
        }

        // Dropdown mein saare products (naam ke saath) bharo
        async function loadProductList() {
            try {
                const res = await fetch(`${apiBaseUrl}/api/products?includeAll=true`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const list = await res.json();
                productSelect.innerHTML = '<option value="">-- Product select karein --</option>';
                (Array.isArray(list) ? list : []).forEach(item => {
                    const option = new Option(`${item.name || 'Product'} (₹${item.price ?? 0})`, item._id);
                    productSelect.add(option);
                });
                if (currentId) {
                    if (![...productSelect.options].some(o => o.value === currentId)) {
                        productSelect.add(new Option('Selected product', currentId));
                    }
                    productSelect.value = currentId;
                }
            } catch (error) {
                productSelect.innerHTML = '<option value="">Products load nahi hue</option>';
                showMessage(error instanceof TypeError
                    ? 'Backend se connection nahi ho raha. Terminal mein "npm start" chalayein (port 5000).'
                    : error.message, false);
            }
        }

        // Ek product ka data form mein bharo
        async function loadProduct(id) {
            formMessage.classList.add('hidden');
            if (!id) { currentId = ''; clearForm(); return; }
            try {
                const [productRes, popularRes] = await Promise.all([
                    fetch(productApiUrl(id)),
                    fetch(`${apiBaseUrl}/api/products/popular`).catch(() => null)
                ]);
                if (!productRes.ok) throw new Error(productRes.status === 404 ? 'Product nahi mila.' : `Server error (HTTP ${productRes.status})`);
                const p = await productRes.json();

                let popularIds = [];
                if (popularRes && popularRes.ok) {
                    const popular = await popularRes.json();
                    if (Array.isArray(popular)) popularIds = popular.map(item => String(item._id));
                }

                currentId = id;
                document.getElementById('productName').value = p.name || '';
                document.getElementById('productPrice').value = p.price ?? '';
                document.getElementById('productStock').value = p.stock ?? 10;
                const categorySelect = document.getElementById('productCategory');
                const category = String(p.category || '').toLowerCase();
                if (category && ![...categorySelect.options].some(o => o.value === category)) {
                    categorySelect.add(new Option(p.category, category));
                }
                categorySelect.value = category || 'men';
                productImage.value = p.image || '';
                // main image gallery ke pehle number par automatically add hoti hai, isliye form mein dobara nahi dikhate
                document.getElementById('galleryImages').value = (p.images || []).filter(url => url !== p.image).join(', ');
                document.getElementById('colorImagesInput').value = (p.colorImages || [])
                    .map(item => `${item.color}=${item.image}`).join('\n');
                document.getElementById('productDescription').value = p.description || '';
                colorPicker.set(p.colors || []);
                sizePicker.set(p.sizes || []);
                document.getElementById('addToLatest').checked = p.isLatest !== false;
                document.getElementById('addToSale').checked = p.isOnSale === true;
                document.getElementById('addToPopular').checked = popularIds.includes(String(p._id));
                updatePreview();
                submitBtn.disabled = false;

                // URL mein bhi id rakho (refresh karne par same product khula rahe)
                try { history.replaceState(null, '', `?id=${encodeURIComponent(id)}`); } catch (e) {}
            } catch (error) {
                clearForm();
                showMessage(error instanceof TypeError
                    ? 'Backend se connection nahi ho raha. Terminal mein "npm start" chalayein (port 5000).'
                    : error.message, false);
            }
        }

        productSelect.addEventListener('change', () => loadProduct(productSelect.value));

        editForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!currentId) { showMessage('Pehle upar se product select karein.', false); return; }
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            const galleryInput = document.getElementById('galleryImages').value.trim();
            const data = {
                name: document.getElementById('productName').value.trim(),
                price: Number(document.getElementById('productPrice').value),
                stock: Number(document.getElementById('productStock').value),
                category: document.getElementById('productCategory').value.trim(),
                image: productImage.value.trim(),
                images: galleryInput ? galleryInput.split(',').map(u => u.trim()).filter(Boolean) : [],
                colorImages: document.getElementById('colorImagesInput').value
                    .split(/\r?\n/).map(line => line.trim()).filter(Boolean)
                    .map(line => {
                        const sep = line.indexOf('=');
                        if (sep < 1) return null;
                        const color = line.slice(0, sep).trim();
                        const image = line.slice(sep + 1).trim();
                        return color && image ? { color, image, images: [image] } : null;
                    }).filter(Boolean),
                colors: colorPicker.get(),
                sizes: sizePicker.get(),
                description: document.getElementById('productDescription').value.trim(),
                isLatest: document.getElementById('addToLatest').checked,
                isPopular: document.getElementById('addToPopular').checked,
                isOnSale: document.getElementById('addToSale').checked
            };

            try {
                const response = await fetch(productApiUrl(currentId), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.message || result.error || `Server Error: ${response.status}`);

                showMessage(result.message || 'Product update ho gaya!', true);
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } catch (error) {
                showMessage(error instanceof TypeError
                    ? 'Backend se connection nahi ho raha. Terminal mein "npm start" chalayein (port 5000).'
                    : error.message, false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Product';
            }
        });

        submitBtn.disabled = true;
        loadProductList().then(() => { if (currentId) loadProduct(currentId); });
    </script>
</body>

</html>
